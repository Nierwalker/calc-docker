# =========================================================
# Docker Compose - Calculadora
# web (nginx) -> api (imagem calculadora-api) -> redis (cache + histórico)
#
# Subir:   docker compose up -d --build
# Status:  docker compose ps
# Parar:   docker compose down        (o volume com o histórico continua)
# =========================================================

services:
  # API Node.js: a imagem criada na atividade passada (Dockerfile)
  api:
    build: .
    image: calculadora-api
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy # só sobe depois do Redis responder
    networks:
      - frontend
      - backend
    restart: unless-stopped # reinicia se cair, menos se for parada à mão
    # o HEALTHCHECK já vem no Dockerfile da imagem

  # Cache dos resultados e histórico das últimas contas
  redis:
    image: redis:7-alpine
    # appendonly: grava cada alteração em disco, o histórico sobrevive a reinícios
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Página da calculadora + proxy reverso para a API
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80" # única porta exposta para fora
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 e não localhost: no Alpine localhost vira IPv6 e o nginx só escuta IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

# Duas redes: o nginx não enxerga o Redis, só a API fala com ele
networks:
  frontend:
  backend:

# Volume nomeado: os dados do Redis ficam fora do container
volumes:
  redis-data:
