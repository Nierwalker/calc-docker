<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Docker</title>
<style>
  body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; padding-top: 60px; }
  .card { background: #1e293b; padding: 28px; border-radius: 12px; width: 320px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: #94a3b8; }
  input, select, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 15px; box-sizing: border-box; }
  button { background: #2563eb; border: none; cursor: pointer; font-weight: bold; }
  #resultado { margin-top: 14px; font-size: 18px; font-weight: bold; }
  #historico { list-style: none; padding: 0; margin: 0; font-size: 14px; color: #cbd5e1; }
  #historico li { padding: 4px 0; border-bottom: 1px solid #334155; }
</style>
</head>
<body>
<div class="card">
  <h1>Calculadora (Docker Compose)</h1>
  <input id="a" type="number" placeholder="Número A">
  <select id="op">
    <option value="soma">Soma (+)</option>
    <option value="subtracao">Subtração (-)</option>
    <option value="multiplicacao">Multiplicação (×)</option>
    <option value="divisao">Divisão (÷)</option>
  </select>
  <input id="b" type="number" placeholder="Número B">
  <button onclick="calcular()">Calcular</button>
  <div id="resultado"></div>
  <h2>Histórico (Redis)</h2>
  <ul id="historico"></ul>
</div>
<script>
  // O nginx repassa /api/... para o container da API (nginx.conf)
  const simbolos = { soma: "+", subtracao: "-", multiplicacao: "×", divisao: "÷" };

  async function calcular() {
    const a = document.getElementById("a").value;
    const b = document.getElementById("b").value;
    const op = document.getElementById("op").value;
    const out = document.getElementById("resultado");
    try {
      const resp = await fetch(`/api/${op}?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
      const dados = await resp.json();
      out.textContent = dados.erro
        ? "Erro: " + dados.erro
        : "Resultado: " + dados.resultado + (dados.cache ? " (do cache)" : "");
    } catch (e) {
      out.textContent = "Erro: API indisponível";
    }
    carregarHistorico();
  }

  async function carregarHistorico() {
    try {
      const resp = await fetch("/api/historico");
      const { historico } = await resp.json();
      document.getElementById("historico").innerHTML = historico
        .map((h) => `<li>${h.a} ${simbolos[h.operacao]} ${h.b} = ${h.resultado}</li>`)
        .join("");
    } catch (e) {}
  }

  carregarHistorico();
</script>
</body>
</html>
