# nginx do serviço "web": serve a página e repassa /api/ para a API
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Usado pelo healthcheck do compose
    location = /health {
        return 200 "ok\n";
    }

    # "api" é o nome do serviço no compose (o DNS da rede do Docker resolve)
    location /api/ {
        proxy_pass http://api:3000/;
    }
}
